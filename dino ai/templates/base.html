<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AetherSuccess – Adaptive AI Employee Success Platform{% endblock %}</title>
    <!-- Modern Font & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Platform Design System -->
    <link rel="stylesheet" href="/static/css/style.css">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="container-fluid p-0">
        <div class="row g-0">
            <!-- Sleek AI SaaS Sidebar -->
            <div class="col-md-3 col-lg-2 sidebar-container">
                <!-- Branding Header -->
                <div class="brand-header">
                    <div class="brand-icon-box">
                        <i class="fas fa-brain"></i>
                    </div>
                    <div>
                        <h1 class="brand-name">AetherSuccess</h1>
                        <span class="brand-subtext">Adaptive AI Platform</span>
                    </div>
                </div>

                <!-- Status Pill -->
                <div class="brand-pill-badge">
                    <span>Autonomous Multi-Agent</span>
                </div>

                <!-- Navigation List -->
                <nav class="sidebar-nav" id="sidebarNav">
                    <a class="nav-link-custom" href="/" data-path="/">
                        <i class="fas fa-home"></i>
                        <span>Home</span>
                    </a>
                    <a class="nav-link-custom" href="/dashboard" data-path="/dashboard">
                        <i class="fas fa-tachometer-alt"></i>
                        <span>Dashboard</span>
                    </a>
                    <a class="nav-link-custom" href="/insights" data-path="/insights">
                        <i class="fas fa-chart-line"></i>
                        <span>Manager Insights</span>
                    </a>
                    <a class="nav-link-custom" href="/knowledge" data-path="/knowledge">
                        <i class="fas fa-book"></i>
                        <span>Knowledge Base</span>
                    </a>
                    <a class="nav-link-custom" href="#" onclick="showAddEmployeeModal(); return false;">
                        <i class="fas fa-user-plus"></i>
                        <span>Add Employee</span>
                    </a>
                </nav>

                <!-- System Status Footer -->
                <div class="mt-auto pt-4" style="border-top: 1px solid var(--sidebar-border);">
                    <div class="d-flex align-items-center gap-2">
                        <span class="badge-status-dot" style="background: #10b981; width: 8px; height: 8px; box-shadow: 0 0 8px #10b981;"></span>
                        <small style="color: #94a3b8; font-size: 0.75rem; font-weight: 500;">Agents Active & Ready</small>
                    </div>
                </div>
            </div>

            <!-- Main Content Area -->
            <div class="col-md-9 col-lg-10 p-4 p-xl-5" style="min-height: 100vh;">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <!-- Redesigned Subtle Glassmorphism Add Employee Modal -->
    <div class="modal fade" id="addEmployeeModal" tabindex="-1" aria-labelledby="addEmployeeModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" style="max-width: 480px;">
            <div class="modal-content modal-content-glass">
                <div class="modal-header-clean">
                    <div class="d-flex align-items-center gap-2">
                        <div class="kpi-icon-pill kpi-icon-teal" style="width: 32px; height: 32px;">
                            <i class="fas fa-user-plus" style="font-size: 0.85rem;"></i>
                        </div>
                        <h5 class="section-title mb-0" id="addEmployeeModalLabel">Add New Employee</h5>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" style="font-size: 0.8rem;"></button>
                </div>
                <div class="modal-body-clean">
                    <form id="addEmployeeForm" onsubmit="event.preventDefault(); addEmployee();">
                        <div class="mb-3">
                            <label for="name" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="name" placeholder="e.g. Alex Rivera" required autocomplete="name">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" placeholder="e.g. alex.rivera@company.com" required autocomplete="email">
                        </div>
                        <div class="mb-3">
                            <label for="department" class="form-label">Department</label>
                            <select class="form-select" id="department" required>
                                <option value="" disabled selected>Select department...</option>
                                <option value="Engineering">Engineering</option>
                                <option value="Sales">Sales</option>
                                <option value="HR">HR</option>
                                <option value="Marketing">Marketing</option>
                                <option value="Finance">Finance</option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <label for="position" class="form-label">Position / Role</label>
                            <input type="text" class="form-control" id="position" placeholder="e.g. Senior Frontend Engineer" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer-clean">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="btnSubmitAddEmployee" onclick="addEmployee()">
                        <i class="fas fa-check"></i>
                        <span>Add Employee</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Highlight active navigation item based on current URL path
        document.addEventListener('DOMContentLoaded', () => {
            const currentPath = window.location.pathname;
            const navLinks = document.querySelectorAll('.sidebar-nav .nav-link-custom');
            navLinks.forEach(link => {
                const targetPath = link.getAttribute('data-path');
                if (targetPath === '/' && currentPath === '/') {
                    link.classList.add('active');
                } else if (targetPath && targetPath !== '/' && currentPath.startsWith(targetPath)) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        });

        function showAddEmployeeModal() {
            const modalEl = document.getElementById('addEmployeeModal');
            const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
            modal.show();
        }

        async function addEmployee() {
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const department = document.getElementById('department').value;
            const position = document.getElementById('position').value.trim();

            if (!name || !email || !department || !position) {
                alert('Please fill in all employee fields.');
                return;
            }

            const btn = document.getElementById('btnSubmitAddEmployee');
            const originalContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Adding...';

            const employeeData = { name, email, department, position };

            try {
                const response = await fetch('/employees/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(employeeData)
                });
                if (response.ok) {
                    location.reload();
                } else {
                    const err = await response.json();
                    alert('Error adding employee: ' + (err.detail || 'Failed'));
                    btn.disabled = false;
                    btn.innerHTML = originalContent;
                }
            } catch (error) {
                alert('Network error: ' + error.message);
                btn.disabled = false;
                btn.innerHTML = originalContent;
            }
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
